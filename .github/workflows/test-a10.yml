name: Test Android 10

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Write test script
        run: |
          cat > run-test.sh << 'EOF'
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          adb install -r "$APK"
          PKG=$(adb shell pm list packages | grep zann | head -1 | cut -d: -f2 | tr -d '\r')
          echo "PKG=$PKG" > crash.txt
          adb logcat -c
          adb shell monkey -p "$PKG" -c android.intent.category.LAUNCHER 1
          sleep 25
          adb logcat -d -b crash >> crash.txt
          adb logcat -d > full.txt
          EOF

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: bash run-test.sh

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-android10
          path: |
            crash.txt
            full.txt

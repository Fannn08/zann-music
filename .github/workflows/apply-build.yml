name: Apply source and build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unpack ZANN-MUSIC-source.zip over the repo
        run: |
          if [ ! -f ZANN-MUSIC-source.zip ]; then
            echo "::error::Upload ZANN-MUSIC-source.zip to the repo root first"
            exit 1
          fi
          unzip -q ZANN-MUSIC-source.zip -d "$RUNNER_TEMP/src"
          rm -rf "$RUNNER_TEMP/src/ZANN-MUSIC/.github"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name ZANN-MUSIC-source.zip -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/src/ZANN-MUSIC/." .
          rm ZANN-MUSIC-source.zip

      - name: Commit source to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply ZANN MUSIC source"
          fi
          git push

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ZANN-MUSIC-debug-apk
          path: app/build/outputs/apk/debug/*.apk
